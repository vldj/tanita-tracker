<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<!-- iOS app feel -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Tanita App</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
margin:0;
font-family:-apple-system;
background:#0f172a;
color:white;
}

/* Splash screen */
#splash {
position:fixed;
top:0;left:0;right:0;bottom:0;
background:#0f172a;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
z-index:9999;
}

/* App */
.header {padding:20px;font-size:22px;font-weight:bold;}
.tabs {display:flex;background:#1e293b;}
.tab {flex:1;padding:12px;text-align:center;opacity:0.6;}
.tab.active {opacity:1;border-bottom:2px solid #22c55e;}
.container {padding:15px;}
.card {background:#1e293b;padding:15px;border-radius:14px;margin-bottom:15px;}
input,select {
width:100%;padding:10px;margin:5px 0;border-radius:8px;
border:none;background:#334155;color:white;
}
button {
width:100%;padding:12px;border:none;border-radius:10px;
background:#22c55e;color:black;font-weight:bold;
}
.hidden{display:none;}
.stat{display:flex;justify-content:space-between;margin:5px 0;}
.green{color:#22c55e;}
.red{color:#ef4444;}
</style>
</head>

<body>

<div id="splash">Tanita Tracker</div>

<div class="header">Tanita Dashboard</div>

<div class="tabs">
<div class="tab active" onclick="showTab('dashboard',event)">Dashboard</div>
<div class="tab" onclick="showTab('input',event)">Unos</div>
<div class="tab" onclick="showTab('charts',event)">Grafici</div>
</div>

<div class="container">

<div id="dashboard" class="card"></div>

<div id="input" class="card hidden">
<input type="date" id="date">
<input type="number" id="weight" placeholder="Težina">
<input type="number" id="fat" placeholder="Body fat">
<input type="number" id="muscle" placeholder="Mišići">
<input type="number" id="water" placeholder="Voda">
<input type="number" id="bmi" placeholder="BMI">
<button onclick="saveData()">Sačuvaj</button>
</div>

<div id="charts" class="card hidden">
<select id="metric" onchange="drawChart()">
<option value="weight">Težina</option>
<option value="fat">Body fat</option>
<option value="muscle">Mišići</option>
<option value="water">Voda</option>
<option value="bmi">BMI</option>
</select>
<canvas id="chart"></canvas>
</div>

</div>

<script>
let data=JSON.parse(localStorage.getItem("tanitaData"))||[];

/* Splash */
setTimeout(()=>{document.getElementById("splash").style.display="none"},1200);

function showTab(tab,e){
document.querySelectorAll('.card').forEach(c=>c.classList.add('hidden'));
document.getElementById(tab).classList.remove('hidden');

document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
e.target.classList.add('active');

if(tab==='dashboard') renderDashboard();
if(tab==='charts') drawChart();
}

function saveData(){
data.push({
date:date.value,
weight:+weight.value,
fat:+fat.value,
muscle:+muscle.value,
water:+water.value,
bmi:+bmi.value
});
localStorage.setItem("tanitaData",JSON.stringify(data));
alert("Sačuvano");
}

function renderDashboard(){
const div=document.getElementById("dashboard");
if(data.length<2){div.innerHTML="Unesi više podataka";return;}

let first=data[0];
let last=data[data.length-1];

let w=(last.weight-first.weight).toFixed(1);
let f=(last.fat-first.fat).toFixed(1);
let m=(last.muscle-first.muscle).toFixed(1);

div.innerHTML=`
<div class="stat">Težina <span class="${w<0?'green':'red'}">${w} kg</span></div>
<div class="stat">Fat <span class="${f<0?'green':'red'}">${f} %</span></div>
<div class="stat">Mišići <span class="${m>0?'green':'red'}">${m}</span></div>
<br>
<div>${w<0?'✔ Mršaviš':'⚠ Nema pada težine'}</div>
<div>${f<0?'✔ Gubiš mast':'⚠ Mast stagnira'}</div>
<div>${m>0?'💪 Mišići rastu':'⚠ Mišići stagniraju'}</div>
`;
}

function drawChart(){
new Chart(chart,{
type:'line',
data:{
labels:data.map(d=>d.date),
datasets:[{
label:'Trend',
data:data.map(d=>d[metric.value]),
borderWidth:2,
tension:0.4
}]
}
});
}
</script>

</body>
</html>
