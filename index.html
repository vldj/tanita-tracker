<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanita PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {margin:0;font-family:-apple-system;background:#0f172a;color:white;}
.container {padding:15px;}
.card {background:#1e293b;padding:15px;border-radius:15px;margin-bottom:15px;}
h2 {margin-top:0;}
input[type=range] {width:100%;}
.value {text-align:right;font-size:14px;opacity:0.8;}
button {
width:100%;padding:14px;border:none;border-radius:12px;
background:#22c55e;color:black;font-weight:bold;margin-top:10px;
}
select {width:100%;padding:10px;border-radius:10px;background:#334155;color:white;}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>Unos</h2>

<label>Težina (kg)</label>
<input type="range" min="50" max="150" step="0.1" id="weight">
<div class="value" id="weightVal"></div>

<label>Body Fat (%)</label>
<input type="range" min="5" max="40" step="0.1" id="fat">
<div class="value" id="fatVal"></div>

<label>Mišići (kg)</label>
<input type="range" min="30" max="80" step="0.1" id="muscle">
<div class="value" id="muscleVal"></div>

<label>Voda (%)</label>
<input type="range" min="40" max="70" step="0.1" id="water">
<div class="value" id="waterVal"></div>

<label>BMI</label>
<input type="range" min="18" max="35" step="0.1" id="bmi">
<div class="value" id="bmiVal"></div>

<label>Kosti (kg)</label>
<input type="range" min="2" max="5" step="0.1" id="bone">
<div class="value" id="boneVal"></div>

<label>Physique Level</label>
<input type="range" min="1" max="9" step="1" id="physique">
<div class="value" id="physiqueVal"></div>

<label>Starost tela</label>
<input type="range" min="15" max="80" step="1" id="age">
<div class="value" id="ageVal"></div>

<button onclick="save()">Sačuvaj</button>
</div>

<div class="card">
<h2>Graf</h2>
<select id="metric" onchange="drawChart()">
<option value="weight">Težina</option>
<option value="fat">Body Fat</option>
<option value="muscle">Mišići</option>
<option value="water">Voda</option>
<option value="bmi">BMI</option>
</select>
<canvas id="chart"></canvas>
</div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("tanitaData")) || [];
let chart;

function updateValues(){
weightVal.innerText = weight.value + " kg";
fatVal.innerText = fat.value + " %";
muscleVal.innerText = muscle.value + " kg";
waterVal.innerText = water.value + " %";
bmiVal.innerText = bmi.value;
boneVal.innerText = bone.value + " kg";
physiqueVal.innerText = physique.value;
ageVal.innerText = age.value + " god";
}

document.querySelectorAll("input").forEach(i=>i.oninput=updateValues);
updateValues();

function save(){
data.push({
date:new Date().toLocaleDateString(),
weight:+weight.value,
fat:+fat.value,
muscle:+muscle.value,
water:+water.value,
bmi:+bmi.value,
bone:+bone.value,
physique:+physique.value,
age:+age.value
});
localStorage.setItem("tanitaData", JSON.stringify(data));
alert("Sačuvano");
drawChart();
}

function drawChart(){
let metric = document.getElementById("metric").value;

if(chart) chart.destroy();

chart = new Chart(document.getElementById("chart"),{
type:'line',
data:{
labels:data.map(d=>d.date),
datasets:[{
label:metric,
data:data.map(d=>d[metric]),
borderWidth:2,
tension:0.4
}]
}
});
}

drawChart();
</script>

</body>
</html>
