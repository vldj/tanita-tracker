<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanita PRO+</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {margin:0;font-family:-apple-system;background:#0f172a;color:white;}
.container {padding:15px;}
.card {background:#1e293b;padding:15px;border-radius:15px;margin-bottom:15px;}
h2 {margin-top:0;}
input[type=range], input[type=number] {width:100%;}
.value {text-align:right;font-size:14px;opacity:0.8;}
button {
width:100%;padding:14px;border:none;border-radius:12px;
background:#22c55e;color:black;font-weight:bold;margin-top:10px;
}
.stat{display:flex;justify-content:space-between;margin:6px 0;}
.green{color:#22c55e;}
.red{color:#ef4444;}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>Cilj</h2>
<input type="number" id="goalWeight" placeholder="Ciljna težina (kg)">
<button onclick="saveGoal()">Sačuvaj cilj</button>
</div>

<div class="card" id="analysis"></div>

<div class="card">
<h2>Unos</h2>

<label>Težina (kg)</label>
<input type="range" min="50" max="150" step="0.1" id="weight">
<div class="value" id="weightVal"></div>

<label>Body Fat (%)</label>
<input type="range" min="5" max="40" step="0.1" id="fat">
<div class="value" id="fatVal"></div>

<label>Mišići (kg)</label>
<input type="range" min="30" max="80" step="0.1" id="muscle">
<div class="value" id="muscleVal"></div>

<button onclick="save()">Sačuvaj</button>
</div>

<div class="card">
<h2>Graf</h2>
<select id="metric" onchange="drawChart()">
<option value="weight">Težina</option>
<option value="fat">Body Fat</option>
<option value="muscle">Mišići</option>
</select>
<canvas id="chart"></canvas>
</div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("tanitaData")) || [];
let goal = localStorage.getItem("goalWeight");
let chart;

if(goal) goalWeight.value = goal;

function updateValues(){
weightVal.innerText = weight.value + " kg";
fatVal.innerText = fat.value + " %";
muscleVal.innerText = muscle.value + " kg";
}

document.querySelectorAll("input[type=range]").forEach(i=>i.oninput=updateValues);
updateValues();

function saveGoal(){
localStorage.setItem("goalWeight", goalWeight.value);
alert("Cilj sačuvan");
}

function save(){
data.push({
date:new Date().toLocaleDateString(),
weight:+weight.value,
fat:+fat.value,
muscle:+muscle.value
});
localStorage.setItem("tanitaData", JSON.stringify(data));
drawChart();
renderAnalysis();
}

function renderAnalysis(){
const div = document.getElementById("analysis");

if(data.length < 2){
div.innerHTML = "Unesi više podataka za analizu";
return;
}

let first = data[0];
let last = data[data.length-1];

let w = (last.weight - first.weight).toFixed(1);
let f = (last.fat - first.fat).toFixed(1);
let m = (last.muscle - first.muscle).toFixed(1);

let goalText = "";
if(goal){
let diff = (last.weight - goal).toFixed(1);
goalText = `<div class="stat">Do cilja <span>${diff} kg</span></div>`;
}

div.innerHTML = `
<h2>Analiza</h2>

<div class="stat">Težina <span class="${w<0?'green':'red'}">${w} kg</span></div>
<div class="stat">Fat <span class="${f<0?'green':'red'}">${f} %</span></div>
<div class="stat">Mišići <span class="${m>0?'green':'red'}">${m} kg</span></div>

${goalText}

<br>
<div>${w<0?'✔ Mršaviš':'⚠ Nema pada težine'}</div>
<div>${f<0?'✔ Gubiš mast':'⚠ Mast stagnira'}</div>
<div>${m>0?'💪 Mišići rastu':'⚠ Mišići stagniraju'}</div>
`;
}

function drawChart(){
let metric = document.getElementById("metric").value;

if(chart) chart.destroy();

chart = new Chart(document.getElementById("chart"),{
type:'line',
data:{
labels:data.map(d=>d.date),
datasets:[{
label:metric,
data:data.map(d=>d[metric]),
borderWidth:2,
tension:0.4
}]
}
});
}

renderAnalysis();
drawChart();
</script>

</body>
</html>
