<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Health Style Tracker</title>

<style>
body {
margin:0;
font-family:-apple-system;
background:#f2f2f7;
color:#000;
}

.container {
padding:15px;
}

.card {
background:white;
border-radius:16px;
padding:15px;
margin-bottom:15px;
box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.title {
font-size:14px;
color:#666;
margin-bottom:10px;
}

/* Wheel picker */
.wheel {
height:120px;
overflow-y:scroll;
scroll-snap-type:y mandatory;
text-align:center;
border-top:1px solid #eee;
border-bottom:1px solid #eee;
}

.wheel div {
height:40px;
line-height:40px;
scroll-snap-align:center;
font-size:18px;
}

.selected {
font-weight:bold;
color:#007aff;
}

.valueDisplay {
text-align:center;
font-size:24px;
margin-bottom:10px;
}

button {
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#007aff;
color:white;
font-weight:bold;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<div class="title">Težina</div>
<div class="valueDisplay" id="weightDisplay">80.0 kg</div>
<div class="wheel" id="weightWheel"></div>
</div>

<div class="card">
<div class="title">Body Fat</div>
<div class="valueDisplay" id="fatDisplay">20.0 %</div>
<div class="wheel" id="fatWheel"></div>
</div>

<button onclick="save()">Sačuvaj</button>

</div>

<script>
let data = JSON.parse(localStorage.getItem("tanitaData")) || [];

function createWheel(id, min, max, step, displayId, unit){
let wheel = document.getElementById(id);

for(let i=min; i<=max; i+=step){
let val = i.toFixed(1);
let div = document.createElement("div");
div.innerText = val;
wheel.appendChild(div);
}

wheel.addEventListener("scroll", ()=>{
let items = wheel.children;
let index = Math.round(wheel.scrollTop / 40);

Array.from(items).forEach(el=>el.classList.remove("selected"));

if(items[index]){
items[index].classList.add("selected");
document.getElementById(displayId).innerText =
items[index].innerText + " " + unit;
}
});
}

createWheel("weightWheel",50,150,0.1,"weightDisplay","kg");
createWheel("fatWheel",5,40,0.1,"fatDisplay","%");

function getSelectedValue(wheelId){
let wheel = document.getElementById(wheelId);
let index = Math.round(wheel.scrollTop / 40);
return parseFloat(wheel.children[index].innerText);
}

function save(){
data.push({
date:new Date().toLocaleDateString(),
weight:getSelectedValue("weightWheel"),
fat:getSelectedValue("fatWheel")
});

localStorage.setItem("tanitaData", JSON.stringify(data));
alert("Sačuvano");
}
</script>

</body>
</html>
