<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanita PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {margin:0;font-family:-apple-system;background:#0f172a;color:white;}
.container {padding:15px;}
.card {background:#1e293b;padding:15px;border-radius:15px;margin-bottom:15px;}
h2 {margin-top:0;}

.stepper {
display:flex;
justify-content:space-between;
align-items:center;
margin:10px 0;
}

.stepper button {
width:40px;height:40px;border:none;border-radius:10px;
background:#22c55e;font-size:20px;
}

.value {
font-size:18px;
}

button.save {
width:100%;padding:14px;border:none;border-radius:12px;
background:#22c55e;color:black;font-weight:bold;margin-top:10px;
}

.stat{display:flex;justify-content:space-between;margin:6px 0;}
.green{color:#22c55e;}
.red{color:#ef4444;}
</style>
</head>

<body>

<div class="container">

<div class="card" id="analysis"></div>

<div class="card">
<h2>Unos</h2>

<div class="stepper">
<span>Težina</span>
<button onclick="step('weight',-0.1)">-</button>
<div class="value" id="weightVal">80</div>
<button onclick="step('weight',0.1)">+</button>
</div>

<div class="stepper">
<span>Fat</span>
<button onclick="step('fat',-0.1)">-</button>
<div class="value" id="fatVal">20</div>
<button onclick="step('fat',0.1)">+</button>
</div>

<div class="stepper">
<span>Mišići</span>
<button onclick="step('muscle',-0.1)">-</button>
<div class="value" id="muscleVal">50</div>
<button onclick="step('muscle',0.1)">+</button>
</div>

<button class="save" onclick="save()">Sačuvaj</button>
</div>

<div class="card">
<h2>Graf</h2>
<select id="metric" onchange="drawChart()">
<option value="weight">Težina</option>
<option value="fat">Fat</option>
<option value="muscle">Mišići</option>
</select>
<canvas id="chart"></canvas>
</div>

</div>

<script>

let chart;

let current = {weight:80, fat:20, muscle:50};

function step(field,delta){
current[field] = +(current[field] + delta).toFixed(1);
updateUI();
}

function updateUI(){
weightVal.innerText = current.weight + " kg";
fatVal.innerText = current.fat + " %";
muscleVal.innerText = current.muscle + " kg";
}

updateUI();

function save(){
data.push({
date:new Date().toLocaleDateString(),
...current
});
localStorage.setItem("tanitaData", JSON.stringify(data));
renderAnalysis();
drawChart();
}
